    const d=ty==='rain'?R(.9,1.6):R(3,7),de=(dl||0)+R(0,d);
    const a=mode==='tw'?`tw ${R(1.5,4)}s ease-in-out ${R(0,3)}s infinite`:`${mode} ${d}s linear ${de}s infinite`;
    h+=`<span class="p ${ty}" style="left:${R(2,96)}%;${mode==='rise'?'bottom:6%':'top:'+(mode==='tw'?R(2,60)+'%':'0')};animation:${a}">${ty==='heart'?ICON.heart:''}</span>`;
  }
  return h;
}
function build(s,n){
  const sc=SC[n],dur=s.mv||s.t*.55,hd=.6,o=s.o||[0,0],Hc=HO[o[0]],Wc=WO[o[1]];
  const hv=`--c1:${Hc[0]};--c2:${Hc[1]};--c3:${Hc[2]}`,wv=`--d1:${Wc[0]};--d2:${Wc[1]};${Wc[2]?'--bt:'+Wc[2]:'--bt:none'}`;
  let w=`<svg class="bd" viewBox="0 0 900 500" preserveAspectRatio="xMidYMax slice">${BDF[BD[n]](sc,n)}</svg>`;
  (s.bigs||[]).forEach(b=>{w+=`<div class="big" style="left:${b[2]}%;animation:bigp 1.2s ease ${b[1]}s both${b[3]?`,bigout .8s ease ${b[3]}s forwards`:''}">${ICON[b[0]]}</div>`});
  const wd=s.md2||hd,wr=s.md2?3:dur;
  if(!s.title){
    if(sc){w+=actor(him,'him',40,40,0,1,1,hv)+actor(her,s.lean?'her lean':'her',50,50,0,1,1,wv)}
    else{w+=actor(him,'him',s.h[0],s.h[1],hd,dur,0,hv)+actor(her,s.lean?'her lean':'her',s.m[0],s.m[1],wd,wr,0,wv)}
  }
  if(s.bq){const a1=s.h[1]+4;w+=`<div class="bq" style="--a0:${s.h[0]+4}%;--a1:${a1}%;--b0:${a1}%;--b1:${s.m[0]-1}%;animation:bqa ${dur}s ease-in-out ${hd}s both,bqb ${s.bq[1]-s.bq[0]}s ease ${s.bq[0]}s forwards">${ICON.bouquet}</div>`}
  if(FGS[n])w+=FGS[n]===1?FG:FGS[n];
  let b='';
  (s.say||[]).forEach(([who,tx,d])=>{
    const p=who==='him'?(sc?[40,40]:s.h):(sc?[50,50]:s.m),dd=who==='him'?hd:wd,dr=who==='him'?dur:wr;
    const x=p[0]+(p[1]-p[0])*Math.min(1,Math.max(0,(d-dd)/dr));
    b+=`<div class="sb ${who}" style="left:${x}%;bottom:calc(12% + var(--sh)*${who==='him'?.47:.385} + 12px);animation-delay:${d}s">${tx}</div>`;
  });
  let c='<div class="cap">'+(s.d?`<div class="d">${s.d}</div>`:'');
  const gap=s.t/(s.cap.length+.8),dl=s.cap.map((_,k)=>s.cd?s.cd[k]:.8+k*gap);
  s.cap.forEach((l,k)=>{const sg=l[0]==='*',du=k<dl.length-1?Math.max(1.6,dl[k+1]-dl[k]-.8):s.t-dl[k]+.3;c+=`<p class="${sg?'sign':''}" style="animation-delay:${dl[k]}s;animation-duration:${du}s">${sg?l.slice(1):l}</p>`});
  c+='</div>';
  const fx=(s.fx?parts(s.fx):'')+(s.fx2?parts(s.fx2):'');
  view.innerHTML=`<div class="scene ${s.dark?'dark':''} ${s.cls||''}"><div class="world ${s.zoom?'zoom':''}">${w}</div>${fx}${b}${s.song?`<div class="song">${s.song}</div>`:''}${c}${s.fo?`<div class="fo" style="animation-delay:${s.t-3.5}s"></div>`:''}${n<S.length-1?`<div class="xf" style="animation-delay:${s.t-1.1}s"></div>`:''}</div>`;
}
function go(n){
  if(n>=S.length){ended=true;playing=false;$('pp').textContent='▶';return}
  si=n;el=0;build(S[n],n);if(au)au.pat=n===3?BAL:MAIN;
}
function tick(now){
  if(playing){
    el+=now-last;
    if(el>=S[si].t*1000)go(si+1);
    if(!ended){let done=0;for(let k=0;k<si;k++)done+=S[k].t*1000;$('pg').style.width=Math.min(100,(done+el)/(total*10))+'%'}
  }
  if(ended)$('pg').style.width='100%';
  last=now;requestAnimationFrame(tick);
}
function setPlay(p){if(au&&au.a){if(p)au.a.play().catch(()=>{});else au.a.pause()}playing=p;stage.classList.toggle('paused',!p);$('pp').textContent=p?'⏸':'▶'}
const MAIN={ms:700,w:'sine',n:[261.6,329.6,392,523.3,392,329.6,293.7,349.2,440,587.3,440,349.2]};
const BAL={ms:520,w:'triangle',n:[130.8,261.6,329.6,392,523.3,392,329.6,261.6,98,196,246.9,392,493.9,392,246.9,196,110,220,261.6,329.6,440,329.6,261.6,220,87.3,174.6,220,261.6,349.2,261.6,220,174.6]};
function synth(){
  const A=new (window.AudioContext||window.webkitAudioContext)(),g=A.createGain();g.gain.value=.06;g.connect(A.destination);
  au={A,pat:si===3?BAL:MAIN,n:0,to:0};
  const loop=()=>{if(!au)return;const p=au.pat,o=A.createOscillator(),e=A.createGain();o.type=p.w;o.frequency.value=p.n[au.n++%p.n.length];e.gain.setValueAtTime(0,A.currentTime);e.gain.linearRampToValueAtTime(1,A.currentTime+.08);e.gain.exponentialRampToValueAtTime(.001,A.currentTime+1.7);o.connect(e);e.connect(g);o.start();o.stop(A.currentTime+1.8);au.to=setTimeout(loop,p.ms)};
  loop();
}
function music_(on){
  if(on&&!au){
    const a=new Audio('asset/musica.mp3');a.loop=true;a.volume=.8;
    au={a};
    a.onerror=()=>{if(au&&au.a===a){au=null;synth()}};
    a.play().catch(()=>{if(au&&au.a===a&&a.error){au=null;synth()}});
  }else if(!on&&au){
    if(au.a)au.a.pause();else{clearTimeout(au.to);au.A.close()}
    au=null;
  }
  $('mu').style.opacity=on?1:.45;
}
function restart(){if(au&&au.a)au.a.currentTime=0;ended=false;go(0);setPlay(true)}
$('start').onclick=()=>{$('over').classList.add('hide');music_(music);restart()};
$('pp').onclick=()=>{if(ended){restart();return}setPlay(!playing)};
$('rp').onclick=restart;
$('mu').onclick=()=>{music=!music;music_(music)};
build(S[0],0);setPlay(false);requestAnimationFrame(tick);
})();
</script>
